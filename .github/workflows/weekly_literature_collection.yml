name: Autonomous Weekly POx Literature Collection

on:
  schedule:
    # Run every Sunday at 02:00 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  collect-literature:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger POx Research Hub Literature Collector
        env:
          BACKEND_URL: ${{ secrets.POX_BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::POX_BACKEND_URL secret is not set. Please configure in repository Secrets."
            exit 1
          fi
          
          echo "Triggering automated literature collection at $BACKEND_URL..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${BACKEND_URL}/api/v1/collector/trigger" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -d '{
              "query": "poly(2-oxazoline) OR poly(2-oxazine) OR 2-oxazoline monomer",
              "year_from": 2020,
              "year_to": 2026,
              "source": "both",
              "max_results": 50
            }')
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          
          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 202 ]; then
            echo "::error::Collector endpoint returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Automated literature collection successfully triggered."
