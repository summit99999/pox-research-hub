name: Autonomous Polymer Journal Tracker Monitoring

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  monitor-journals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Live Journal Feeds & Crossref/OpenAlex Endpoints
        run: |
          echo "=== Polymer Research Intelligence Hub (PRIH) ==="
          echo "Running 6-hour autonomous monitoring across 10 canonical polymer journals..."
          
          declare -A JOURNALS=(
            ["Macromolecules"]="0024-9297"
            ["Biomacromolecules"]="1525-7797"
            ["Polymer Chemistry"]="1759-9954"
            ["Progress in Polymer Science"]="0079-6700"
            ["ACS Applied Polymer Materials"]="2637-6105"
            ["ACS Applied Materials & Interfaces"]="1944-8244"
            ["JACS"]="0002-7863"
            ["Angewandte Chemie"]="1433-7851"
            ["Chemical Science"]="2041-6520"
            ["Small"]="1613-6810"
          )
          
          SUCCESS_COUNT=0
          for NAME in "${!JOURNALS[@]}"; do
            ISSN="${JOURNALS[$NAME]}"
            echo "Checking live feed for $NAME (ISSN: $ISSN)..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.crossref.org/journals/${ISSN}/works?rows=5&sort=published&order=desc")
            if [ "$STATUS" -eq 200 ]; then
              echo "  [OK] $NAME feed is reachable (HTTP 200)."
              SUCCESS_COUNT=$((SUCCESS_COUNT+1))
            else
              echo "  [WARN] $NAME returned HTTP status $STATUS."
            fi
          done
          
          echo "Feed validation complete: $SUCCESS_COUNT/10 journals healthy."

      - name: Trigger Backend Ingestion Pipeline (if configured)
        env:
          BACKEND_URL: ${{ secrets.POX_BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$BACKEND_URL" ]; then
            echo "Dispatching automated collection request to $BACKEND_URL..."
            curl -s -X POST "${BACKEND_URL}/api/v1/collector/trigger" \
              -H "Content-Type: application/json" \
              -H "X-Cron-Secret: ${CRON_SECRET}" \
              -d '{
                "query": "polymer OR macromolecules OR polyoxazoline",
                "year_from": 2024,
                "year_to": 2026,
                "source": "both",
                "max_results": 40
              }' || true
          else
            echo "POX_BACKEND_URL secret not configured; skipped cloud webhook dispatch."
          fi
